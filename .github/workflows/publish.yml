name: Build and Push Docker Images

on:
  push:
    branches: [testing]
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push skillmind-core
        uses: docker/build-push-action@v6
        with:
          context: ./Core/SkillmindCore
          platforms: linux/amd64
          push: true
          tags: joshuaenc/skillmind-core:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push skillmind-api-gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api-gateway/Dockerfile
          platforms: linux/amd64
          push: true
          tags: joshuaenc/skillmind-api-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push skillmind-notification
        uses: docker/build-push-action@v6
        with:
          context: ./notification-service
          platforms: linux/amd64
          push: true
          tags: joshuaenc/skillmind-notification:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push skillmind-recommendation
        uses: docker/build-push-action@v6
        with:
          context: ./recommendation-service
          platforms: linux/amd64
          push: true
          tags: joshuaenc/skillmind-recommendation:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
