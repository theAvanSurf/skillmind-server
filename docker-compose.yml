
services:
  redis:
    image: redis:7.2-alpine
    container_name: skillmind-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
      target: development
    container_name: skillmind-api-gateway
    ports:
      - "3000:3000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKER: kafka:29092
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      # Database environment variables for API Gateway (if applicable)
      DATABASE_URL: ${POSTGRES_URL}
      # Email settings
      EMAILER_HOST: ${EMAILER_HOST}
      EMAILER_PORT: ${EMAILER_PORT}
      EMAILER_USER: ${EMAILER_USER}
      EMAILER_PASS: ${EMAILER_PASS}
    volumes:
      - ./api-gateway/src:/usr/src/app/src
      - ./api-gateway/tsconfig.json:/usr/src/app/tsconfig.json
      - ./api-gateway/nest-cli.json:/usr/src/app/nest-cli.json
    depends_on:
      - redis
      - kafka
      - core

  core:
    build:
      context: ./Core/SkillmindCore
      dockerfile: Dockerfile
    container_name: skillmind-core
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DatabaseUrl=${POSTGRES_URL}
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__DurationInMinutes=${JWT_DURATION_MINUTES}
      - EmailSettings__Host=${EMAILER_HOST}
      - EmailSettings__Port=${EMAILER_PORT}
      - EmailSettings__User=${EMAILER_USER}
      - EmailSettings__Password=${EMAILER_PASS}
    depends_on:
      - redis

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: skillmind-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: skillmind-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0


volumes:
  redis-data:
