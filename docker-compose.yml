
services:
  redis:
    image: redis:7.2-alpine
    container_name: skillmind-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always

  api-gateway:
    build: .
    container_name: skillmind-api-gateway
    ports:
      - "3000:3000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

volumes:
  redis-data:
