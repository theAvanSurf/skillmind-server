services:
  redis:
    image: redis:7.2-alpine
    container_name: skillmind-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: skillmind-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: [ "CMD", "sh", "-c", "nc -z 127.0.0.1 2181" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: always

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: skillmind-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 60000
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 60000
    healthcheck:
      test: [ "CMD", "sh", "-c", "nc -z 127.0.0.1 9092" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: always

  core:
    image: joshuaenc/skillmind-core:latest
    build:
      context: ./Core/SkillmindCore
      dockerfile: Dockerfile
      target: development
    container_name: skillmind-core
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DatabaseUrl=${POSTGRES_URL}
      - ConnectionStrings__Redis=redis:6379
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__DurationInMinutes=${JWT_DURATION_MINUTES}
      - FRONTEND_URL=${FRONTEND_URL}
      - PAYMENT_DEFAULT_LOOKUP_KEY=${PAYMENT_DEFAULT_LOOKUP_KEY:-Skillmind_Premium_Plan-42a1204}
      - Stripe__SecretKey=${STRIPE_SECRET_KEY}
      - Stripe__PublishableKey=${STRIPE_PUBLISHABLE_KEY:-}
      - Stripe__WebhookSecret=${STRIPE_WEBHOOK_SECRET}
      - EmailSettings__Host=${EMAILER_HOST}
      - EmailSettings__Port=${EMAILER_PORT}
      - EmailSettings__User=${EMAILER_USER}
      - EmailSettings__Password=${EMAILER_PASS}
      - Kafka__BrokerAddress=kafka:29092
      # Google / YouTube OAuth (Sprint 8)
      - Google__ClientId=${Google__ClientId:-}
      - Google__ClientSecret=${Google__ClientSecret:-}
      - Google__RedirectUri=${Google__RedirectUri:-https://skillmind-api.avansurf.com/api/v1/live-streams/oauth/callback}
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  api-gateway:
    image: joshuaenc/skillmind-api-gateway:latest
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
      target: development
    container_name: skillmind-api-gateway
    ports:
      - "3000:3000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKER: kafka:29092
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      DATABASE_URL: ${POSTGRES_URL}
      EMAILER_HOST: ${EMAILER_HOST}
      EMAILER_PORT: ${EMAILER_PORT}
      EMAILER_USER: ${EMAILER_USER}
      EMAILER_PASS: ${EMAILER_PASS}
      PAYMENT_DEFAULT_LOOKUP_KEY: ${PAYMENT_DEFAULT_LOOKUP_KEY:-Skillmind_Premium_Plan-42a1204}
      CORE_SERVICE_URL: http://core:8080
      API_VERSION: ${API_VERSION}
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:8000
    volumes:
      - ./api-gateway/src:/usr/src/app/src
      - ./api-gateway/tsconfig.json:/usr/src/app/tsconfig.json
      - ./api-gateway/nest-cli.json:/usr/src/app/nest-cli.json
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
      core:
        condition: service_started
    restart: on-failure

  notification-service:
    image: joshuaenc/skillmind-notification:latest
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: skillmind-notification-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      KAFKA_BROKER: kafka:29092
      SMTP_HOST: ${EMAILER_HOST}
      SMTP_PORT: ${EMAILER_PORT}
      SMTP_USER: ${EMAILER_USER}
      SMTP_PASS: ${EMAILER_PASS}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
    depends_on:
      kafka:
        condition: service_healthy
    restart: always

  recommendation-service:
    image: joshuaenc/skillmind-recommendation:latest
    build:
      context: ./recommendation-service
      dockerfile: Dockerfile
    container_name: skillmind-recommendations
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${POSTGRES_URL_ASYNC}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKER: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure

volumes:
  redis-data:
